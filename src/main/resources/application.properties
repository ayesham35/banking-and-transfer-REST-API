spring.application.name=bankapi

# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://banking-db:3306/bankdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=bankuser
spring.datasource.password=bankpass

# JPA / Hibernate
# Flyway owns the scheme - JPA only validates that entities match
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# JWT settings
# Generate a real secret with: openssl rand -base64 64
# Do NOT use this value in production
app.jwt.secret=PZ6af6QDoERKMh6pTEHoWml9UN9iKgJ6RKuXaamvFncU/vMrJOVi+TniIl3nsfiGx5i0ulhaClAQijZSWYAgxA==
app.jwt.expiration-ms=3600000

# Actuator
management.endpoints.web.exposure.include=health

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.flywaydb=DEBUG

# Money formatting
spring.jackson.deserialization.use-big-decimal-for-floats=true

# Retry database connection on startup
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

